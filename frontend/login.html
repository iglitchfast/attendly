<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Attendly — Log In</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="form-card">
    <h2 id="form-title">Log In</h2>
    <p>Track attendance without the manual counting.</p>

    <form id="login-form">
      <label for="email">Email</label>
      <input type="email" id="email" required />

      <label for="password">Password</label>
      <input type="password" id="password" required />

      <button type="submit" id="submit-btn" class="btn-primary">Log In</button>
      <div class="error-text" id="error-msg"></div>
    </form>

    <p style="margin-top: 16px; text-align: center;">
      <a href="#" id="toggle-link" class="btn-link">Need an account? Register</a>
    </p>
  </div>

  <script src="js/client.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
